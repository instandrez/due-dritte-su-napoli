?'checked':'')+' onchange="toggle('+p.id+',this.checked)"><span><strong>'+esc(p.name)+'</strong><small>📍 '+esc(p.zone)+'</small></span></label>').join('')+'</section>':''}).join('');count()}function count(){document.getElementById('count').textContent=selected.size+' imperdibili selezionati su '+places.length}function toggle(id,on){on?selected.add(id):selected.delete(id);count();document.getElementById('status').textContent='Selezione modificata · premi Salva selezione.'}function ids(){return [...selected].sort((a,b)=>a-b)}function save(){try{localStorage.setItem('napoli-highlights',JSON.stringify(ids()));document.getElementById('status').textContent='Salvato su questo dispositivo. Per applicarlo alla guida per tutti, usa Copia per la chat.'}catch{document.getElementById('status').textContent='Il browser non consente il salvataggio: usa Copia per la chat o Scarica selezione.'}}function payload(){return JSON.stringify({imperdibili:ids(),posti:places.filter(p=>selected.has(p.id)).map(p=>({id:p.id,nome:p.name}))},null,2)}async function copySelection(){let text=payload();try{await navigator.clipboard.writeText(text);document.getElementById('status').textContent='Selezione copiata: incollala nella chat e la pubblicherò per tutti.'}catch{const t=document.getElementById('copy-output');t.hidden=false;t.value=text;t.select();document.getElementById('status').textContent='Copia il testo selezionato e incollalo nella chat.'}}function download(){const url=URL.createObjectURL(new Blob([payload()],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='imperdibili-napoli.json';a.click();URL.revokeObjectURL(url);document.getElementById('status').textContent='File preparato. Puoi allegarlo nella chat per pubblicare la selezione.'}render();</script></html>
